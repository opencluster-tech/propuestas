/* Explorador sereno: tres columnas (familias · productos · ficha) sobre un fondo claro; un solo acento navy, el celeste solo para lo que se toca */
:root{
  --fondo:#F3F5F8; --papel:#FFFFFF; --riel:#FAFBFC; --tinta:#1A2232; --gris:#667085; --tenue:#98A2B3; --linea:#E4E7EC; --suave:#F2F5FA;
  --acento:#0B2A6F; --acento-suave:#E9EFFA; --cielo:#0798D6; --cielo-txt:#0478B0; --cielo-suave:#E8F6FD; --precio:#0B2A6F; --logo:#0B2A6F;
  --f:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#0C111B; --papel:#121A27; --riel:#0F1622; --tinta:#E4E8EF; --gris:#A0AABB; --tenue:#6F7A8D; --linea:#232D3D; --suave:#172133;
  --acento:#B9CEF5; --acento-suave:#1A2A48; --cielo:#5CC3F2; --cielo-txt:#7DD1F7; --cielo-suave:#0F2C3D; --precio:#D5E2FA; --logo:#DCE5F5; color-scheme:dark}}

  --fondo:#0C111B; --papel:#121A27; --riel:#0F1622; --tinta:#E4E8EF; --gris:#A0AABB; --tenue:#6F7A8D; --linea:#232D3D; --suave:#172133;
  --acento:#B9CEF5; --acento-suave:#1A2A48; --cielo:#5CC3F2; --cielo-txt:#7DD1F7; --cielo-suave:#0F2C3D; --precio:#D5E2FA; --logo:#DCE5F5; color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--fondo);color:var(--tinta);font-family:var(--f);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cielo);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.foto{background:#fff}

.app{display:grid;grid-template-columns:260px minmax(0,1fr) clamp(400px,38vw,620px);min-height:100vh}

.marca p{font-size:12px;color:var(--gris);line-height:1.45;padding-top:12px;border-top:1px solid var(--linea)}
.marca p b{display:block;color:var(--tinta);font-weight:700;font-size:13px}
.riel h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);padding:0 10px}
.fl{display:flex;flex-direction:column;gap:1px;margin-top:-12px}
.fb{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;text-align:left;width:100%;color:var(--gris)}
.fb:hover{background:var(--suave);color:var(--tinta)}
.fb[aria-current="true"]{background:var(--acento-suave);color:var(--acento)}
.fb .ic{flex:none;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.fb .ic svg{width:20px;height:20px}
.fb span.n{flex:1;min-width:0;font-size:13.5px;font-weight:600;line-height:1.3}
.fb b{font-size:12px;font-weight:600;color:var(--tenue)}
.fb[aria-current="true"] b{color:inherit}
.nota-riel{margin-top:auto;font-size:12px;color:var(--tenue);padding:0 10px}

/* Columna central */
.centro{min-width:0;padding:30px 28px 120px}
.cab{padding:0 2px}
.cab .kick{font-size:12px;font-weight:600;color:var(--gris);display:flex;align-items:center;gap:8px}
.cab .kick svg{width:18px;height:18px;color:var(--acento)}
.cab h1{font-size:26px;color:var(--tinta);margin-top:6px}
.cab p{color:var(--gris);margin-top:4px;max-width:64ch}
.herr{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.busca{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:8px 12px}
.busca svg{width:17px;height:17px;color:var(--tenue);flex:none}
.busca input{border:0;background:none;outline:none;font:inherit;color:var(--tinta);width:100%;min-width:0}
.herr select{font:inherit;color:var(--tinta);background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:8px 10px}
.filas{display:flex;flex-direction:column;margin-top:18px;background:var(--papel);border:1px solid var(--linea);border-radius:14px;overflow:hidden}
.fila{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;background:none;border:0;border-bottom:1px solid var(--linea);padding:12px 16px 12px 12px;text-align:left;width:100%;position:relative}
.fila:last-child{border-bottom:0}
.fila:hover{background:var(--suave)}
.fila[aria-current="true"]{background:var(--acento-suave)}
.fila[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--acento)}
.fila .t{width:72px;height:72px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px;border:1px solid var(--linea)}
.fila .t img{max-height:100%;object-fit:contain}
.fila h3{font-size:14.5px;font-weight:600;color:var(--tinta)}
.fila p{font-size:13px;color:var(--gris);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.fila .pr{text-align:right;white-space:nowrap}
.fila .pr small{display:block;font-size:11px;font-weight:500;color:var(--tenue)}
.fila .pr b{font-size:16px;font-weight:700;color:var(--precio)}
.fila .sel{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:11.5px;font-weight:600;color:var(--cielo)}
.vacio{padding:36px;text-align:center;color:var(--gris)}

/* Columna de la ficha */
.ficha{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--papel);border-left:1px solid var(--linea);padding:26px max(24px,env(safe-area-inset-right,0px)) 120px 24px}
.ficha .cerrar{display:none}
.g-main{border-radius:14px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:18px;border:1px solid var(--linea);position:relative}
.g-main img{max-height:100%;object-fit:contain}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:999px;border:1px solid #E4E7EC;background:rgba(255,255,255,.95);color:#0B2A6F;display:flex;align-items:center;justify-content:center}
.g-nav svg{width:16px;height:16px}.g-nav.a{left:8px}.g-nav.b{right:8px}
.g-cont{position:absolute;bottom:8px;right:10px;font-size:11px;font-weight:600;color:#667085}
.g-ths{display:flex;gap:6px;margin-top:8px}
.g-th{width:48px;height:48px;border:1px solid var(--linea);border-radius:8px;padding:3px;display:flex;align-items:center;justify-content:center;opacity:.7}
.g-th img{max-height:100%;object-fit:contain}
.g-th[aria-current="true"]{opacity:1;border-color:var(--acento)}
.chipfam{display:flex;align-items:center;gap:6px;margin-top:20px;font-size:12px;font-weight:600;color:var(--gris)}
.chipfam svg{width:16px;height:16px;color:var(--acento)}
.ficha h2{font-size:20px;color:var(--tinta);margin-top:4px}
.ficha .lead{color:var(--gris);margin-top:8px;font-size:14px}
.opciones{margin-top:18px;border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--linea)}
.op:last-child{border-bottom:0}
.op .nm{font-size:13px;font-weight:600}
.op .li{font-size:12px;color:var(--gris)}
.op .fz{font-weight:700;font-size:17px;color:var(--precio);text-align:right}
.op .add{grid-column:1/-1;display:flex;justify-content:flex-start;margin-top:6px}
.btn-add{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linea);border-radius:999px;background:var(--papel);color:var(--acento);font-weight:600;font-size:12.5px;padding:5px 12px}
.btn-add:hover{border-color:var(--acento)}
.btn-add svg{width:14px;height:14px}
.btn-add.ya{background:var(--acento-suave);border-color:transparent}
.iva{font-size:12px;color:var(--tenue);margin-top:8px}
details{border-top:1px solid var(--linea);padding:12px 0}
details:first-of-type{margin-top:18px}
summary{font-weight:600;font-size:14px;color:var(--tinta);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--tenue);border-bottom:1.5px solid var(--tenue);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
details ul{padding-left:18px;margin-top:8px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--tinta)}
details ul li::marker{color:var(--tenue)}
details dl{margin-top:6px}
details dl div{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid var(--linea);font-size:13px}
details dl div:last-child{border-bottom:0}
details dt{color:var(--gris)}details dd{font-weight:600;text-align:right}

/* Mi selección */
.barra-sel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:14px;background:var(--papel);color:var(--tinta);border:1px solid var(--linea);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 30px rgba(16,24,40,.14);max-width:calc(100% - 32px);font-size:13.5px}
.barra-sel .num{font-weight:700}
.barra-sel button{border:0;border-radius:999px;background:var(--acento);color:var(--papel);font-weight:600;padding:8px 16px;white-space:nowrap}
.cajon{position:fixed;inset:0;z-index:40;background:rgba(12,17,27,.4);display:flex;justify-content:flex-end}
.cajon-b{background:var(--papel);width:min(460px,100%);height:100%;overflow-y:auto;padding:24px max(22px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:14px}
.cajon-h{display:flex;justify-content:space-between;align-items:center}
.cajon-h h2{font-size:20px}
.xbtn{width:34px;height:34px;border-radius:999px;border:1px solid var(--linea);background:var(--papel);color:var(--gris);display:flex;align-items:center;justify-content:center}
.xbtn svg{width:16px;height:16px}
.it{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;border-bottom:1px solid var(--linea);padding-bottom:12px}
.it .t{width:52px;height:52px;border-radius:8px;border:1px solid var(--linea);padding:4px;display:flex;align-items:center;justify-content:center}
.it .t img{max-height:100%;object-fit:contain}
.it b{font-size:13.5px;font-weight:600;display:block}
.it small{color:var(--gris);font-size:12px}
.cant{display:flex;align-items:center;gap:8px;margin-top:6px}
.cant button{width:26px;height:26px;border-radius:7px;border:1px solid var(--linea);background:var(--papel);display:flex;align-items:center;justify-content:center;color:var(--acento)}
.cant button svg{width:13px;height:13px}
.it .st{font-weight:700;color:var(--precio);text-align:right;white-space:nowrap}
.tot{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--suave)}
.tot div{display:flex;justify-content:space-between;font-size:14px}
.tot .g{font-size:19px;font-weight:700;color:var(--precio)}
.copiar{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;background:var(--acento);color:var(--papel);font-weight:600;padding:11px}
.copiar svg{width:17px;height:17px}
.ayuda{font-size:12.5px;color:var(--gris)}
.copiado{font-size:13px;font-weight:600;color:var(--cielo);text-align:center}
textarea{width:100%;min-height:140px;font:inherit;font-size:12.5px;border:1px solid var(--linea);border-radius:10px;padding:10px;background:var(--suave);color:var(--tinta)}

.famsel{display:none}
@media (max-width:1180px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .ficha{position:fixed;inset:0 0 0 auto;width:min(460px,100%);z-index:35;box-shadow:-20px 0 50px rgba(16,24,40,.18);transform:translateX(105%);transition:transform .25s}
  .ficha.abierta{transform:none}
  .ficha .cerrar{display:flex;margin-left:auto;margin-bottom:10px}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .riel,.centro{min-width:0}
  .herr select{flex:1}
  .riel{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linea);padding:18px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));gap:14px}
  .riel .fl,.riel h2,.nota-riel{display:none}
  .famsel{display:block;width:100%;font:inherit;font-weight:600;padding:10px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--papel);color:var(--tinta)}
  .centro{padding:20px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
  .fila{grid-template-columns:60px minmax(0,1fr)}
  .fila .t{width:60px;height:60px}
  .fila .pr{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Un toque de color por familia (tono apagado, solo en íconos, marcas y fondos muy suaves) */
:root{--c:var(--acento)}
.fb .ic{color:var(--c)}
.fb[aria-current="true"]{background:color-mix(in srgb,var(--c) 13%,var(--papel));color:var(--tinta)}
.fb[aria-current="true"] .ic{color:var(--c)}
.fb[aria-current="true"] b{color:var(--c)}
.cab .kick svg{color:var(--c)}
.cab .kick{color:var(--c)}
.cab .ico{display:inline-flex;width:30px;height:30px;border-radius:9px;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,var(--papel))}
.filas{border-top:3px solid var(--c)}
.fila[aria-current="true"]{background:color-mix(in srgb,var(--c) 9%,var(--papel))}
.fila[aria-current="true"]::before{background:var(--c)}
.fila .t{background:#fff}
.chipfam,.chipfam svg{color:var(--c)}
.g-th[aria-current="true"]{border-color:var(--c)}
.opciones{border-top:3px solid var(--c)}
.btn-add{color:var(--c)}
.btn-add:hover{border-color:var(--c)}
.btn-add.ya{background:color-mix(in srgb,var(--c) 12%,var(--papel))}
summary::after{border-color:var(--c)}
details ul li::marker{color:var(--c)}
.docs{border-top:1px solid var(--linea);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.docs-t{font-weight:600;font-size:14px;margin-bottom:2px}
.doc{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--linea);border-radius:10px;color:var(--tinta);text-decoration:none;font-size:13.5px}
.doc:hover{border-color:var(--c)}
.doc svg{width:18px;height:18px;flex:none;color:var(--c)}
/* 6-nov: valor Fundación y descuento en celeste de la marca */
.fila .pr b{color:var(--cielo-txt)}
.opciones{border-top:3px solid var(--cielo)}
.op{background:var(--cielo-suave)}
.op .fz{color:var(--cielo-txt);font-size:20px;line-height:1.1}
.op .fz small{display:block;font-size:11px;font-weight:600;color:var(--gris);letter-spacing:.02em}
.dto{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:999px;background:var(--papel);border:1px solid var(--cielo);color:var(--cielo-txt);font-weight:700;font-size:11.5px;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <aside class="riel">
    <div class="marca"><span class="logo" role="img" aria-label="OpenCluster Tech, Construyendo Inclusión"></span><p><b>Catálogo de ayudas técnicas</b>Valores especiales para la Fundación Te Apoyamos</p></div>
    <label for="famsel" class="famsel-l" hidden>Familia</label>
    <select id="famsel" class="famsel" aria-label="Elegir familia"></select>
    <h2>Familias</h2>
    <nav class="fl" id="fl" aria-label="Familias"></nav>
    <p class="nota-riel">Valores con IVA incluido. Descuentos especiales sobre el valor de lista de nuestra tienda.</p>
  </aside>
  <main class="centro" id="centro">
    <section class="cab" id="cab"></section>
    <div class="filas" id="filas"></div>
  </main>
  <aside class="ficha" id="ficha" aria-label="Ficha del producto"></aside>
</div>


<script src="iconos.js"></script>
<script src="datos.js"></script>
<script>
(function(){
var COL={movilidad:'#2F855A',bano:'#1A86C7',catres:'#2E55B0',cojines:'#9C3A78',sillones:'#7350B8',posicionamiento:'#6E7F1A',pie:'#8B5A2E',respiratorio:'#0E7C86',ocular:'#4B47B5',comunicacion:'#C0365F',vision:'#9A7A0C',acceso:'#B23A3A',tecno:'#4F5D73'};
var F=CAT.fams,P=CAT.prods,fam={},porId={};F.forEach(function(f){fam[f.id]=f;});P.forEach(function(p){porId[p.id]=p;});
var actual=F[0].id,lista=[],sel=null,foto=0,orden='web',carro={};
function guarda(){try{localStorage.setItem('fta-sel',JSON.stringify(carro));}catch(e){}}
var $=function(id){return document.getElementById(id);};
var q='';

function desde(p){var v=p.p.filter(function(x){return x[3];});if(!v.length)return null;return v.reduce(function(a,b){return b[3]<a[3]?b:a;});}
function setColor(id){document.documentElement.style.setProperty('--c',COL[id]);}

function riel(){$('fl').innerHTML=F.map(function(f){return '<button class="fb" type="button" data-f="'+f.id+'" aria-current="'+(f.id===actual&&!q)+'" style="--c:'+COL[f.id]+'"><span class="ic">'+svg(f.ic)+'</span><span class="n">'+esc(f.n)+'</span><b class="num">'+f.count+'</b></button>';}).join('');
  $('famsel').innerHTML=F.map(function(f){return '<option value="'+f.id+'"'+(f.id===actual?' selected':'')+'>'+esc(f.n)+' ('+f.count+')</option>';}).join('');}

function centro(){var f=fam[actual];
  var base=q?P.filter(function(p){var t=(p.n+' '+p.l).toLowerCase();return q.split(/\s+/).every(function(w){return t.indexOf(w)>=0;});}):P.filter(function(p){return p.f===actual;});
  if(orden!=='web')base=base.slice().sort(function(a,b){var x=desde(a),y=desde(b);x=x?x[3]:1e12;y=y?y[3]:1e12;return orden==='menor'?x-y:(y===1e12?-1:x===1e12?1:y-x);});
  lista=base;setColor(q?'comunicacion':actual);
  $('cab').innerHTML='<p class="kick"><span class="ico">'+svg(q?'buscar':f.ic)+'</span>'+(q?'Búsqueda en todas las familias':'Familia · '+f.count+' productos')+'</p><h1>'+(q?'Resultados para «'+esc(q)+'»':esc(f.n))+'</h1><p>'+(q?lista.length+' productos encontrados.':esc(f.t))+'</p>'+
   '<div class="herr"><label class="busca">'+svg('buscar')+'<input id="q" type="search" placeholder="Buscar en todo el catálogo" aria-label="Buscar en todo el catálogo" value="'+esc(q)+'"></label>'+
   '<select id="ord" aria-label="Ordenar"><option value="web">Orden de la tienda</option><option value="menor">Menor valor</option><option value="mayor">Mayor valor</option></select></div>';
  $('ord').value=orden;$('ord').onchange=function(){orden=this.value;centro();};
  var inp=$('q');inp.oninput=function(){q=inp.value.trim().toLowerCase();var pos=inp.selectionStart;centro();riel();var n=$('q');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  $('filas').innerHTML=lista.length?lista.map(function(p,k){var d=desde(p),en=p.p.some(function(v,i){return carro[p.id+'|'+i];});
    return '<button class="fila" type="button" data-k="'+k+'" aria-current="'+(sel===p.id)+'" style="--c:'+COL[p.f]+'"><span class="t foto"><img src="img/'+p.i[0]+'" alt="" loading="lazy"></span><span><h3>'+esc(p.n)+'</h3><p>'+esc(p.l)+'</p></span>'+
    '<span class="pr">'+(d?'<small>'+(p.p.length>1&&p.p.some(function(v){return v[3]!==d[3];})?'Desde':'Valor Fundación')+'</small><b class="num">'+clp(d[3])+'</b>':'<small>Valor Fundación</small><b>A cotizar</b>')+(en?'<br><span class="sel">'+svg('check',2.4).replace('<svg','<svg width="12" height="12"')+'En mi selección</span>':'')+'</span></button>';}).join('')
   :'<p class="vacio">No encontramos productos con esa búsqueda. Prueba con otra palabra, por ejemplo «colchón» o «pulsador».</p>';}

function ficha(id,abrir){var p=porId[id];if(!p)return;sel=id;foto=0;var c=COL[p.f];var el=$('ficha');el.style.setProperty('--c',c);
  function grupo(t,arr,tipo,open){if(!arr||!arr.length)return '';return '<details'+(open?' open':'')+'><summary>'+t+'</summary>'+(tipo==='l'?'<ul>'+arr.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'<dl>'+arr.map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>';}).join('')+'</dl>')+'</details>';}
  el.innerHTML='<button class="xbtn cerrar" type="button" id="f-x" aria-label="Cerrar ficha">'+svg('x',2)+'</button>'+
   '<div class="g-main foto"><img id="g-img" src="img/'+p.i[0]+'" alt="'+esc(p.n)+'">'+(p.i.length>1?'<button class="g-nav a" type="button" id="g-a" aria-label="Foto anterior">'+svg('prev',2.2)+'</button><button class="g-nav b" type="button" id="g-b" aria-label="Foto siguiente">'+svg('next',2.2)+'</button><span class="g-cont" id="g-c">1 / '+p.i.length+'</span>':'')+'</div>'+(p.i.length>1?'<div class="g-ths">'+p.i.map(function(x,n){return '<button class="g-th foto" type="button" data-n="'+n+'" aria-label="Foto '+(n+1)+'" aria-current="'+(n===0)+'"><img src="img/'+x+'" alt=""></button>';}).join('')+'</div>':'')+
   '<p class="chipfam">'+svg(fam[p.f].ic)+esc(fam[p.f].n)+'</p><h2>'+esc(p.n)+'</h2><p class="lead">'+esc(p.d[0]||p.l)+'</p>'+
   '<div class="opciones">'+p.p.map(function(v,i){var k=p.id+'|'+i;return '<div class="op"><div>'+(v[0]?'<div class="nm">'+esc(v[0])+'</div>':'')+(v[1]?'<div class="li num">Valor de lista '+clp(v[1])+' <span class="dto">'+v[2]+'% de descuento</span></div>':'<div class="li">Valor a cotizar</div>')+'</div>'+
     '<div class="fz num">'+(v[3]?'<small>Valor Fundación</small>'+clp(v[3]):'')+'</div></div>';}).join('')+'</div><p class="iva">Valores con IVA incluido.</p>'+
   grupo('Descripción',p.d.slice(1),'l',false)+grupo('Características',p.c,'l',true)+grupo('Beneficios',p.b,'l',false)+grupo('Especificaciones',p.e,'d',false)+grupo('Medidas',p.m,'d',false)+grupo('Qué incluye',p.k,'l',false)+(p.o&&p.o.length?'<div class="docs"><p class="docs-t">Documentos del fabricante</p>'+p.o.map(function(d){return '<a class="doc" href="'+esc(d[1])+'" target="_blank" rel="noopener">'+svg('doc')+'<span>'+esc(d[0])+'</span></a>';}).join('')+'</div>':'');
  el.scrollTop=0;
  if(p.i.length>1){var mover=function(d,abs){foto=abs!=null?abs:(foto+d+p.i.length)%p.i.length;$('g-img').src='img/'+p.i[foto];$('g-c').textContent=(foto+1)+' / '+p.i.length;el.querySelectorAll('.g-th').forEach(function(t){t.setAttribute('aria-current',+t.getAttribute('data-n')===foto);});};el.querySelectorAll('.g-th').forEach(function(t){t.onclick=function(){mover(0,+t.getAttribute('data-n'));};});$('g-a').onclick=function(){mover(-1);};$('g-b').onclick=function(){mover(1);};}
  $('f-x').onclick=function(){el.classList.remove('abierta');};
  if(abrir)el.classList.add('abierta');
  document.querySelectorAll('.fila').forEach(function(b){b.setAttribute('aria-current',lista[+b.getAttribute('data-k')].id===id);});}

function totales(){var n=0,t=0,cot=0;Object.keys(carro).forEach(function(k){var a=k.split('|'),p=porId[a[0]];if(!p){delete carro[k];return;}var v=p.p[+a[1]];n+=carro[k];if(v[3])t+=v[3]*carro[k];else cot++;});return {n:n,t:t,cot:cot};}
function barra(){var s=totales();$('barra').hidden=!s.n;$('b-n').textContent=s.n+(s.n===1?' producto':' productos');$('b-t').textContent=clp(s.t);}
function texto(){var s=totales();var l=['Selección de ayudas técnicas · Fundación Te Apoyamos',''];Object.keys(carro).forEach(function(k){var a=k.split('|'),p=porId[a[0]],v=p.p[+a[1]];l.push(carro[k]+' x '+p.n+(v[0]?' ('+v[0]+')':'')+' · '+(v[3]?clp(v[3])+' c/u':'a cotizar'));});l.push('','Total: '+clp(s.t)+' (IVA incluido)'+(s.cot?' + '+s.cot+' a cotizar':''));return l.join('\n');}
function cajon(){var s=totales();var ks=Object.keys(carro);
  $('cajon-b').innerHTML='<div class="cajon-h"><h2 id="sel-t">Mi selección</h2><button class="xbtn" type="button" id="c-x" aria-label="Cerrar">'+svg('x',2)+'</button></div>'+
   (ks.length?ks.map(function(k){var a=k.split('|'),p=porId[a[0]],v=p.p[+a[1]];return '<div class="it"><span class="t foto"><img src="img/'+p.i[0]+'" alt=""></span><div><b>'+esc(p.n)+'</b><small>'+esc(v[0]||'')+(v[3]?(v[0]?' · ':'')+clp(v[3])+' c/u':' Valor a cotizar')+'</small>'+
    '<div class="cant"><button type="button" data-q="'+k+'|-1" aria-label="Quitar uno">'+svg('menos',2.4)+'</button><span class="num">'+carro[k]+'</span><button type="button" data-q="'+k+'|1" aria-label="Agregar uno">'+svg('mas',2.4)+'</button></div></div><span class="st num">'+(v[3]?clp(v[3]*carro[k]):'—')+'</span></div>';}).join('')+
    '<div class="tot"><div><span>Productos</span><span class="num">'+s.n+'</span></div><div><span>Total con IVA</span><span class="g num">'+clp(s.t)+'</span></div>'+(s.cot?'<div><span>Productos a cotizar</span><span class="num">'+s.cot+'</span></div>':'')+'</div>'+
    '<button class="copiar" type="button" id="copiar">'+svg('copiar',2)+'Copiar mi selección</button><p class="copiado" id="copiado" hidden>Listo, la selección quedó copiada. Pégala en un correo o en WhatsApp para enviárnosla.</p>'+
    '<p class="ayuda">Si el botón no copia, selecciona el texto de abajo y cópialo.</p><textarea id="txt" readonly aria-label="Texto de mi selección">'+esc(texto())+'</textarea>'
   :'<p class="ayuda">Todavía no agregas productos. Abre la ficha de un producto y toca «Agregar a mi selección».</p>');
  $('c-x').onclick=function(){$('cajon').hidden=true;};
  var cp=$('copiar');if(cp)cp.onclick=function(){var t=texto();var ok=function(){$('copiado').hidden=false;};try{navigator.clipboard.writeText(t).then(ok,function(){$('txt').select();});}catch(e){$('txt').select();}};}

document.addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(b){actual=b.getAttribute('data-f');q='';riel();centro();ficha(lista[0].id,false);try{history.replaceState(null,'','#'+actual);}catch(x){}window.scrollTo(0,0);return;}
  var r=e.target.closest('.fila');if(r){ficha(lista[+r.getAttribute('data-k')].id,true);return;}
  var a=e.target.closest('[data-add]');if(a){var k=a.getAttribute('data-add');if(carro[k])delete carro[k];else carro[k]=1;guarda();barra();ficha(sel,false);centro();return;}
  var qq=e.target.closest('[data-q]');if(qq){var s=qq.getAttribute('data-q').split('|'),kk=s[0]+'|'+s[1];carro[kk]=(carro[kk]||0)+(+s[2]);if(carro[kk]<=0)delete carro[kk];guarda();barra();cajon();centro();if(sel)ficha(sel,false);return;}
});
$('famsel').onchange=function(){actual=this.value;q='';riel();centro();ficha(lista[0].id,false);};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('ficha').classList.remove('abierta');}});
var h=location.hash.slice(1);if(fam[h])actual=h;
riel();centro();ficha(lista[0].id,false);
})();
</script>
</body>
</html>
