<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Propuesta en preparación · OpenCluster Tech</title>
<link rel="icon" href="isotipo-oct.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --celeste:#08ACF2; --tinta:#14243a; --suave:#5b6b80; --fondo:#f4f8fb; --tarjeta:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --tinta:#e8eef5; --suave:#a6b4c4; --fondo:#0f1722; --tarjeta:#172231; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--fondo); color:var(--tinta); font-family:Manrope, system-ui, sans-serif; padding:24px 16px; }
  .caja { background:var(--tarjeta); max-width:520px; width:100%; border-radius:18px; padding:40px 32px;
          text-align:center; box-shadow:0 10px 40px rgba(8,40,70,.08); border-top:5px solid var(--celeste); }
  img { width:72px; height:auto; margin-bottom:18px; }
  h1 { font-family:Montserrat, sans-serif; font-size:1.45rem; line-height:1.3; margin:0 0 14px; }
  p { color:var(--suave); line-height:1.6; margin:0 0 12px; }
  a.correo { display:inline-block; margin-top:14px; padding:12px 22px; border-radius:999px; background:var(--celeste);
             color:#fff; font-weight:700; text-decoration:none; word-break:break-all; }
  a.correo:hover { filter:brightness(.92); }
</style>
</head>
<body>
  <main class="caja">
    <img src="isotipo-oct.png" alt="OpenCluster Tech">
    <h1>Estamos trabajando en esta propuesta</h1>
    <p>La propuesta para el DAEM de Puerto Montt se está actualizando y por ahora no está disponible.</p>
    <p>Para acceder a su contenido o por cualquier consulta, escríbanos:</p>
    <a class="correo" href="mailto:rayen.ogalde@opencluster-tech.cl?subject=Propuesta%20DAEM%20Puerto%20Montt">rayen.ogalde@opencluster-tech.cl</a>
  </main>
</body>
</html>
